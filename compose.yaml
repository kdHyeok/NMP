name: nmp
services:
  nmp:
    image: nmp:local
    build:
      context: .
      target: runtime
    user: "${NMP_UID:-10001}:${NMP_GID:-10001}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    stop_grace_period: 30s
    environment:
      NMP_CONFIG_DIR: /run/nmp
      NMP_HEALTH_PORT: "8080"
      NMP_HEALTH_URL_FILE: /tmp/nmp-health.url
    volumes:
      - type: bind
        source: ./.nmp
        target: /run/nmp
        read_only: true
        bind:
          create_host_path: false
    command: [python, -B, -m, naver_mail_mcp.cli, tunnel]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"